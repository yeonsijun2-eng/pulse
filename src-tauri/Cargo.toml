[package]
name = "pulse"
version = "1.0.0"
description = "PULSE local-first Windows PC management"
authors = ["PULSE"]
edition = "2021"

[lib]
name = "pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.36", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sysinfo = "0.35"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
